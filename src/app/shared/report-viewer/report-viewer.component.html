@if (reportData?.pdfReportData) {
  <p-dialog
    [header]="reportData.reportTitle"
    [(visible)]="reportData.showReportViewer"
    [modal]="true"
    [baseZIndex]="10000"
    [maximizable]="true"
    styleClass="report-viewer-dialog"
    [style]="{ width: '90vw', maxWidth: '1200px' }"
    [breakpoints]="{ '960px': '96vw' }"
  >
    @if (reportData.base64Data) {
      <embed class="report-viewer-frame" [src]="reportData.pdfReportData | sanitise" width="100%" />
    } @else {
      <iframe class="report-viewer-frame" [src]="reportData.pdfReportData | sanitise" width="100%"></iframe>
    }
  </p-dialog>
}
