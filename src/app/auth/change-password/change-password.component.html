<app-page-header title="Change Password" [subtitle]="session.user()?.emailAddress" />
<div class="card narrow">
  <label class="field-label" for="current">Current password</label>
  <p-password inputId="current" [(ngModel)]="current" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
  <label class="field-label" for="new">New password</label>
  <p-password inputId="new" [(ngModel)]="newPassword" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
  <small class="muted">At least 8 characters.</small>
  <label class="field-label" for="retype">Retype new password</label>
  <p-password inputId="retype" [(ngModel)]="retype" [feedback]="false" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" />
  <div class="form-actions">
    <p-button label="Change password" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </div>
</div>
